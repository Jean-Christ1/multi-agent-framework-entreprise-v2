[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaf-framework"
version = "0.1.0"
description = "Jems Agent Framework - Hybrid neuro-symbolic automation"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "JEMS Innovation Team", email = "innovation@jems-group.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.28,<1.0",
    "aiosqlite>=0.19,<1.0",
    "python-dotenv>=1.0,<2.0",
    "packaging>=23.0,<25.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
llm = [
    "crewai>=0.28,<1.0",
    "openai>=1.0,<2.0",
]
demo = [
    "pyarrow>=14.0.0,<18.0",
    "pandas>=2.0,<3.0",
    "faker>=22.0.0,<30.0",
    "pyyaml>=6.0,<7.0",
    "lxml>=5.0.0,<6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://gitlab.jems-group.com/jems/interne/jems-multi-agent-framework"
Documentation = "https://gitlab.jems-group.com/jems/interne/jems-multi-agent-framework/-/blob/main/docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[project.scripts]
jaf = "framework.cli.main:app"

[tool.pytest.ini_options]
filterwarnings = [
    "default::DeprecationWarning"
]
# Ignore deprecated test files with old/broken APIs and database-dependent tests
addopts = [
    "--ignore=tests/test_adapters/test_crewai.py",
    "--ignore=tests/test_core/test_actor.py",
    "--ignore=tests/test_core/test_engine.py",
    "--ignore=tests/test_core/test_models.py",
    "--ignore=tests/integration/test_event_bus_db_subscriber.py",
    "--ignore=tests/persistence/test_process_repo.py",
    "--ignore=tests/integration/test_crash_recovery.py",
    "--ignore=tests/integration/test_end_to_end.py",
    "--ignore=tests/integration/test_end_to_end_workflow.py",
    "--ignore=tests/integration/test_llm_telemetry_persistence.py",
    "--ignore=tests/test_crash_recovery_resume.py",
]

[tool.ruff]
# Exclude deprecated test files with old APIs
extend-exclude = [
    "tests/test_adapters/test_crewai.py",
    "tests/test_core/test_actor.py",
    "tests/test_core/test_engine.py",
    "tests/test_core/test_models.py"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_return_any = false
strict_equality = false
ignore_missing_imports = true
exclude = [
    "^tests/",
    "^examples/",
    "^migrations/",
    "^agents/"
]

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "langchain.*",
    "langchain_openai.*",
    "pyarrow.*",
    "pandas.*",
    "faker.*",
    "requests.*",
    "packaging.*",
    "openai.*",
    "httpx.*",
    "utils.*",
    "config.*",
    "prompt_builder.*"
]
ignore_missing_imports = true
